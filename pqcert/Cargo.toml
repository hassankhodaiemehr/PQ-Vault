[package]
name = "pqcert"
version = "0.2.0"
edition = "2021"

[dependencies]
crystals-dilithium = "1.0.0"
ml-dsa = "=0.1.1"
pqcrypto-falcon = "0.4"
pqcrypto-traits = "0.3"
sha3 = "0.10"
rand = { version = "0.8.5", features = ["std_rng"] }
rayon = "1.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[features]
h384 = []

[profile.release]
opt-level = 3
